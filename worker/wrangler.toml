name = "photolens-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-11-21"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Model được cấu hình ở đây; API key chỉ được lưu bằng wrangler secret.
GEMINI_MODEL = "gemini-3.8-flash"
# Thay https://photolens.example.com bằng origin web thực tế trước khi deploy.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://localhost,capacitor://localhost,photolens://app,https://photolens.example.com"

[[ratelimits]]
name = "PHOTO_AI_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60
